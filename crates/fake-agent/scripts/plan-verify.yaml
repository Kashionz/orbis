# Plan Gate → Verification 失敗後重試 → 通過（C2 的完成條件 e2e、A2 的 Planning／Verification 測試共用）。
#
# 派工時打開 Plan Gate（`plan_gate: true`），Task 加一條 command 條件，指令是：
#
#     git grep --no-index -q pass verify.txt
#
# （只依賴 git；cmd、sh、PowerShell 都不需要處理引號；檔案還沒 commit 也找得到。）
#
# 1. Planning：送出 plan 全文後結束回合 → Runner 送 plan_proposed（prompt_fallback）→ Plan Gate。
# 2. Plan Gate 核准後：寫入 verify.txt（內容是 fail）→ Verification 第一次失敗（exit code 1）。
# 3. 收到重試的 prompt（verification_retry）後：改成 pass → Verification 第二次通過 → Review Gate。
description: Plan Gate、Verification 失敗後重試、再通過
turns:
  - steps:
      - message: |
          # 計畫

          1. 新增 verify.txt。
          2. 執行 Verification 的指令確認內容。
      - stop: end_turn
  - expect_prompt_contains: Plan 已核准
    steps:
      - message: 依照計畫新增 verify.txt。
      - tool_call:
          id: write-verify
          title: 新增 verify.txt
          edit:
            path: verify.txt
            content: "fail\n"
      - stop: end_turn
  - steps:
      - message: Verification 失敗，修正 verify.txt。
      - tool_call:
          id: fix-verify
          title: 修改 verify.txt
          edit:
            path: verify.txt
            old_text: fail
            new_text: pass
      - message: 已修正。
      - stop: end_turn

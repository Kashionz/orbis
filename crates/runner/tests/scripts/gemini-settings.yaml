# Gemini CLI 在 session 中途於受保護的 .gemini/ 目錄新增檔案（不經過權限請求）：
# Runner 要中止這個回合並問人；接受後以「請繼續」接續同一個 session。
description: 在 .gemini/ 新增設定檔
turns:
  - steps:
      - tool_call:
          id: write-gemini-policy
          title: 新增 .gemini/policies/allow.toml
          edit:
            path: .gemini/policies/allow.toml
            content: "[[rule]]\ntoolName = \"run_shell_command\"\ndecision = \"allow\"\n"
      - wait_for_cancel
  - expect_prompt_contains: 請繼續剛才的工作
    steps:
      - message: 第二回合完成。
      - stop: end_turn

# Agent 修改自己的設定檔：
# - 第一回合：經由權限請求寫入 .claude/settings.json（auto 政策下一律問人；人允許的寫入視為已接受），
#   再直接寫入 .claude/settings.local.json（不經過權限請求，模擬 Claude Code 自己寫入「永遠允許」
#   或設定中 allow 的工具）。Runner 要在 session 中途發現並中止這個回合（issue #52）。
# - 第二回合：人處理完設定檔之後，Runner 以「請繼續」的 prompt 接續同一個 session。
description: Agent 修改自己的設定檔
turns:
  - steps:
      - permission:
          tool_call:
            id: write-settings
            title: 編輯 .claude/settings.json
            raw_input: { file_path: .claude/settings.json }
            edit:
              path: .claude/settings.json
              content: "{ \"permissions\": { \"allow\": [\"Bash(*)\"] } }\n"
          allow:
            - message: 已修改 settings.json。
          reject:
            - message: 好，不修改 settings.json。
      - tool_call:
          id: write-local-settings
          title: 編輯 .claude/settings.local.json
          edit:
            path: .claude/settings.local.json
            content: "{ \"permissions\": { \"allow\": [\"Bash(*)\"] } }\n"
      - wait_for_cancel
  - expect_prompt_contains: 請繼續剛才的工作
    steps:
      - message: 第二回合完成。
      - stop: end_turn

[package]
name = "orbis-runner"
description = "Orbis Runner：管理 Worktree、以 ACP 啟動 Agent、把 Event 串流到 Server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbis-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
agent-client-protocol = "=3.5.0"
bytes = "1.12.1"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
gethostname = "1.1.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io"] }
rand = "0.9"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10.9"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "0.9"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
orbis-fake-agent = { path = "../fake-agent" }
tempfile = "3.27.0"

[lints]
workspace = true

name: CI

# 只改文件時不跑 CI。ARCHITECTURE.md 例外：lint 會檢查 §3 列出的路徑都存在。
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/ARCHITECTURE.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/ARCHITECTURE.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Rust 測試失敗時印出完整的 backtrace
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # 完整系統 e2e（Web／Desktop 的 M1）：PR 上只在 Linux 跑，push 到 main 與手動執行時三平台都跑。
      SYSTEM_E2E: ${{ github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 依 rust-toolchain.toml 安裝固定版本的 Rust
      - name: Install Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # 依 package.json 的 packageManager 安裝 pnpm
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 完整系統 e2e 用的原生 Postgres（macOS 與 Windows 的 runner 不能跑 Linux container）。
      # 只有完整系統 e2e 的步驟會拿到 DATABASE_URL，其他 DB 測試照舊用 Testcontainers。
      # 固定在 master 的 commit：v8 的 Linux 安裝用 apt-key，ubuntu-latest（26.04）已經沒有這個指令，
      # master 已改用 /etc/apt/keyrings，但還沒有發新版
      - name: Install Postgres
        id: postgres
        if: env.SYSTEM_E2E == 'true'
        uses: ikalnytskyi/action-setup-postgres@0f1fdf59c857aabfa61ab1a2619e9af34de678d3
        with:
          postgres-version: "17"

      - name: Lint（Biome、rustfmt、clippy、名稱常數、ARCHITECTURE §3 路徑）
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Cargo test
        run: cargo test --workspace

      # ADR-0003：packages/protocol 必須與 Rust 型別的產生結果一致
      - name: ts-rs 一致性檢查
        run: |
          cargo gen-protocol
          if [ -n "$(git status --porcelain -- packages/protocol)" ]; then
            git status --porcelain -- packages/protocol
            git diff -- packages/protocol
            echo "::error::packages/protocol 與 crates/orbis-protocol 的產生結果不一致，請執行 pnpm gen:protocol 後 commit"
            exit 1
          fi

      - name: Drizzle schema 與 migration 一致性檢查
        run: pnpm --filter @orbis/server db:check

      # DB 測試（Testcontainers）只在 Linux 跑：GitHub 的 macOS runner 沒有 Docker，
      # Windows runner 只能跑 Windows container。測試會在其他平台明確 skip 並印出原因。
      - name: pnpm test
        run: pnpm -r test

      - name: Script tests
        run: node --test scripts/*.test.mjs

      - name: Install Playwright browser
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --filter @orbis/web exec playwright install --with-deps chromium
          else
            pnpm --filter @orbis/web exec playwright install chromium
          fi

      - name: Playwright（Web）
        run: pnpm --filter @orbis/web test:e2e

      # 完整系統的 M1 e2e：真實 Server + Postgres + Local Runner + Fake Agent（apps/server 的 e2e:stack）。
      # stack 接上面安裝的原生 Postgres。
      - name: Playwright（Web 完整系統 M1）
        if: env.SYSTEM_E2E == 'true'
        env:
          ORBIS_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          cargo build -p orbis-runner -p orbis-fake-agent
          pnpm --filter @orbis/web test:e2e:system

      # Desktop 的 e2e 以 Playwright 的 Electron 模式跑，sidecar 用真實的 Runner（test:e2e 會先 cargo build）。
      # Linux runner 沒有顯示器，用 xvfb 提供虛擬的 X server。
      - name: Playwright（Desktop）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm --filter @orbis/desktop test:e2e
          else
            pnpm --filter @orbis/desktop test:e2e
          fi

      # Electron 版的 M1 路徑：stack 不啟動 Runner，由 Desktop 的 sidecar 自己 Pairing，走到 merge 後 Task 轉 Done。
      # 看板要 1280×720 的 viewport，Linux 的虛擬螢幕要夠大。
      - name: Playwright（Desktop 完整系統 M1）
        if: env.SYSTEM_E2E == 'true'
        env:
          ORBIS_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          cargo build -p orbis-runner -p orbis-fake-agent
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm --filter @orbis/desktop test:e2e:system
          else
            pnpm --filter @orbis/desktop test:e2e:system
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Upload 完整系統 e2e 的 trace 與 log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-e2e-${{ matrix.os }}
          path: |
            apps/web/test-results/system
            apps/web/test-results/system-logs
          if-no-files-found: ignore

      - name: Upload Desktop Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-desktop-${{ matrix.os }}
          path: apps/desktop/playwright-report
          if-no-files-found: ignore

      - name: Upload Desktop 完整系統 e2e 的 trace 與 log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-e2e-desktop-${{ matrix.os }}
          path: |
            apps/desktop/test-results/system
            apps/desktop/test-results/system-logs
          if-no-files-found: ignore

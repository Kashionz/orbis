name: CI

# 只改文件時不跑 CI。ARCHITECTURE.md 例外：lint 會檢查 §3 列出的路徑都存在。
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/ARCHITECTURE.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/ARCHITECTURE.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Rust 測試失敗時印出完整的 backtrace
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux 目前不在 CI 驗證（先以 Windows 與 macOS 為主），程式中的 Linux 路徑保留。
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # 完整系統 e2e（Web／Desktop 的 M1）：PR 上只在 Windows（主要平台）跑，push 到 main 與手動執行時兩個平台都跑。
      SYSTEM_E2E: ${{ github.event_name != 'pull_request' || matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 依 rust-toolchain.toml 安裝固定版本的 Rust
      - name: Install Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # 依 package.json 的 packageManager 安裝 pnpm
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DB 測試與完整系統 e2e 用的原生 Postgres（macOS 與 Windows 的 runner 不能跑 Linux container）。以 TEST_DATABASE_URL 傳給測試與 e2e:stack，
      # 它們各自在上面建立獨立的 database，用完刪除。
      # 固定在 master 的 commit（v8 的 Linux 安裝用已移除的 apt-key；之後把 Linux 加回 CI 時仍需要）
      - name: Install Postgres
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@0f1fdf59c857aabfa61ab1a2619e9af34de678d3
        with:
          postgres-version: "17"

      - name: Lint（Biome、rustfmt、clippy、名稱常數、ARCHITECTURE §3 路徑）
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Cargo test
        run: cargo test --workspace

      # ADR-0003：packages/protocol 必須與 Rust 型別的產生結果一致
      - name: ts-rs 一致性檢查
        run: |
          cargo gen-protocol
          if [ -n "$(git status --porcelain -- packages/protocol)" ]; then
            git status --porcelain -- packages/protocol
            git diff -- packages/protocol
            echo "::error::packages/protocol 與 crates/orbis-protocol 的產生結果不一致，請執行 pnpm gen:protocol 後 commit"
            exit 1
          fi

      - name: Drizzle schema 與 migration 一致性檢查
        run: pnpm --filter @orbis/server db:check

      # DB 測試兩個平台都跑，接上面安裝的原生 Postgres（沒有設定時才用 Testcontainers）。
      - name: pnpm test
        env:
          ORBIS_TEST_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: pnpm -r test

      - name: Script tests
        run: node --test scripts/*.test.mjs

      - name: Install Playwright browser
        run: pnpm --filter @orbis/web exec playwright install chromium

      - name: Playwright（Web）
        run: pnpm --filter @orbis/web test:e2e

      # 完整系統的 M1 e2e：真實 Server + Postgres + Local Runner + Fake Agent（apps/server 的 e2e:stack）。
      # stack 在上面安裝的原生 Postgres 上建立自己的 database。
      - name: Playwright（Web 完整系統 M1）
        if: env.SYSTEM_E2E == 'true'
        env:
          ORBIS_TEST_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          cargo build -p orbis-runner -p orbis-fake-agent
          pnpm --filter @orbis/web test:e2e:system

      # Desktop 的 e2e 以 Playwright 的 Electron 模式跑，sidecar 用真實的 Runner（test:e2e 會先 cargo build）。
      - name: Playwright（Desktop）
        run: pnpm --filter @orbis/desktop test:e2e

      # Electron 版的 M1 路徑：stack 不啟動 Runner，由 Desktop 的 sidecar 自己 Pairing，走到 merge 後 Task 轉 Done。
      - name: Playwright（Desktop 完整系統 M1）
        if: env.SYSTEM_E2E == 'true'
        env:
          ORBIS_TEST_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          cargo build -p orbis-runner -p orbis-fake-agent
          pnpm --filter @orbis/desktop test:e2e:system

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: Upload 完整系統 e2e 的 trace 與 log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-e2e-${{ matrix.os }}
          path: |
            apps/web/test-results/system
            apps/web/test-results/system-logs
          if-no-files-found: ignore

      - name: Upload Desktop Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-desktop-${{ matrix.os }}
          path: apps/desktop/playwright-report
          if-no-files-found: ignore

      - name: Upload Desktop 完整系統 e2e 的 trace 與 log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-e2e-desktop-${{ matrix.os }}
          path: |
            apps/desktop/test-results/system
            apps/desktop/test-results/system-logs
          if-no-files-found: ignore

# 本機開發用：只有 Postgres。Server、Web 用 `pnpm dev` 在本機跑，Runner 用 `pnpm dev:runner`。
# 正式部署用的 compose（Server、Team Runner）在 91-integration-release 階段加入。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orbis
      POSTGRES_PASSWORD: orbis
      POSTGRES_DB: orbis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbis -d orbis"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
